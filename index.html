<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stocker PRO Lite · 老虎證券智能手續費大師</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #030712; color: #f3f4f6; }
        .dragging { opacity: 0.4; background-color: #1f2937 !important; }
        tr[draggable="true"] { cursor: grab; }
        tr[draggable="true"]:active { cursor: grabbing; }
    </style>
</head>
<body class="min-h-screen flex flex-col p-6 max-w-6xl mx-auto pb-16">

    <!-- 頂部標題區 -->
    <header class="flex justify-between items-center pb-6 border-b border-gray-800">
        <div>
            <h1 class="text-xl font-bold tracking-tight">STOCKER <span class="text-amber-400">PRO LITE</span></h1>
            <p class="text-xs text-gray-400">老虎證券智能費率計算與港美股動態管理系統</p>
        </div>
        <div class="flex gap-2">
            <span class="text-xs bg-amber-500/10 text-amber-400 border border-amber-500/20 px-3 py-1.5 rounded-xl font-bold">基礎貨幣: HKD</span>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="mt-6 space-y-6 flex-grow">
        
        <!-- 資產摘要卡片 -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-gray-900 p-5 rounded-2xl border border-gray-800 shadow-lg">
                <p class="text-xs text-gray-400 uppercase font-bold">總資產淨值 (含現金)</p>
                <h3 class="text-2xl font-extrabold text-white mt-1" id="summary-assets">HK$ 0.00</h3>
            </div>
            <div class="bg-gray-900 p-5 rounded-2xl border border-gray-800 shadow-lg">
                <p class="text-xs text-gray-400 uppercase font-bold">持股股票總市值</p>
                <h3 class="text-2xl font-extrabold text-emerald-400 mt-1" id="summary-equity">HK$ 0.00</h3>
            </div>
            <div class="bg-gray-900 p-5 rounded-2xl border border-gray-800 shadow-lg">
                <p class="text-xs text-gray-400 uppercase font-bold">可用現金儲備</p>
                <h3 class="text-2xl font-extrabold text-amber-400 mt-1" id="summary-cash">HK$ 66,800.53</h3>
            </div>
        </div>

        <!-- 新增股票輸入表單卡片 -->
        <div class="bg-gradient-to-br from-gray-900 to-gray-950 p-5 rounded-2xl border border-amber-500/30 shadow-xl space-y-4">
            <div class="border-b border-gray-800 pb-2 flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <i data-lucide="plus-circle" class="w-4 h-4 text-amber-400"></i>
                    <h3 class="text-xs font-bold text-white uppercase tracking-wider">新增持股輸入表單 (老虎證券費率自動試算)</h3>
                </div>
                <span id="input-market-badge" class="text-[10px] bg-gray-800 text-gray-400 px-2 py-0.5 rounded font-bold">等待輸入代號...</span>
            </div>
            
            <form onsubmit="handleAddStock(event)" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3 items-end">
                <!-- 股票代號輸入框 -->
                <div class="relative">
                    <label class="block text-[10px] font-bold text-gray-400 mb-1">股票代號 (純數=港股 / 英文=美股)</label>
                    <input type="text" id="input-symbol" oninput="handleSymbolInput(this.value)" placeholder="例: 2388 或 AAPL" autocomplete="off" required class="w-full bg-gray-800 border border-gray-700 rounded-xl px-3 py-2 text-xs text-white uppercase focus:outline-none focus:border-amber-400">
                    
                    <!-- 美股下拉選單 -->
                    <div id="symbol-dropdown" class="absolute left-0 right-0 top-full mt-1 bg-gray-850 border border-gray-700 rounded-xl shadow-2xl z-50 hidden max-h-48 overflow-y-auto"></div>
                </div>

                <div>
                    <label class="block text-[10px] font-bold text-gray-400 mb-1" id="label-shares">持股數量 / 手數</label>
                    <input type="number" step="any" id="input-shares" oninput="calculateTigerFee()" placeholder="港股輸入手數 / 美股輸股數" required class="w-full bg-gray-800 border border-gray-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-amber-400">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-gray-400 mb-1">平均成本</label>
                    <input type="number" step="any" id="input-cost" oninput="calculateTigerFee()" placeholder="例: 37.0" required class="w-full bg-gray-800 border border-gray-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-amber-400">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-gray-400 mb-1">手續費 / 佣金 (老虎自動算，可修改)</label>
                    <input type="number" step="any" id="input-fee" placeholder="老虎手續費" required class="w-full bg-gray-800 border border-gray-700 rounded-xl px-3 py-2 text-xs text-amber-300 font-bold focus:outline-none focus:border-amber-400">
                </div>
                <div>
                    <button type="submit" class="w-full py-2.5 bg-amber-400 hover:bg-amber-500 text-gray-950 font-bold text-xs rounded-xl transition-all shadow-md flex items-center justify-center gap-1">
                        <i data-lucide="check" class="w-3.5 h-3.5"></i> 確認新增持股
                    </button>
                </div>
            </form>
        </div>

        <!-- ==================== 🇭🇰 港股持倉區塊 ==================== -->
        <div class="bg-gray-900 rounded-2xl border border-gray-800 shadow-xl overflow-hidden">
            <div class="p-5 border-b border-gray-800 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-gray-950/30">
                <div class="flex items-center gap-2">
                    <span class="text-base">🇭🇰</span>
                    <h3 class="text-sm font-bold text-white">港股持倉名單 (一手手單位)</h3>
                </div>
                <div class="flex flex-wrap items-center gap-2">
                    <button id="btn-toggle-hk" onclick="toggleManualSort('HK')" class="px-3 py-1.5 rounded-xl border border-gray-700 bg-gray-800 text-gray-300 text-xs font-bold transition-all flex items-center gap-1.5">
                        <i data-lucide="lock" id="icon-hk" class="w-3.5 h-3.5"></i>
                        <span id="text-hk">手動排版: 鎖定</span>
                    </button>
                    <button onclick="autoFormatTable('HK')" class="px-3 py-1.5 bg-gray-800 hover:bg-gray-700 text-amber-400 text-xs font-bold rounded-xl border border-amber-500/20 transition-all flex items-center gap-1">
                        <i data-lucide="wand-2" class="w-3.5 h-3.5"></i> ✨ 一鍵排版
                    </button>
                </div>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs text-gray-300">
                    <thead class="bg-gray-950 text-[10px] uppercase text-gray-400 border-b border-gray-800">
                        <tr>
                            <th class="p-4 w-10 text-center">拖曳</th>
                            <th class="p-4">代號 / 名稱</th>
                            <th class="p-4">持股手數 (每手股數)</th>
                            <th class="p-4 text-right">平均成本 (HKD)</th>
                            <th class="p-4 text-right">實時現價 (HKD)</th>
                            <th class="p-4 text-right">市值</th>
                            <th class="p-4 text-right">總盈虧</th>
                            <th class="p-4 text-center">操作</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-hk" class="divide-y divide-gray-800"></tbody>
                </table>
            </div>
        </div>

        <!-- ==================== 🇺🇸 美股持倉區塊 ==================== -->
        <div class="bg-gray-900 rounded-2xl border border-gray-800 shadow-xl overflow-hidden">
            <div class="p-5 border-b border-gray-800 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-gray-950/30">
                <div class="flex items-center gap-2">
                    <span class="text-base">🇺🇸</span>
                    <h3 class="text-sm font-bold text-white">美股持倉名單</h3>
                </div>
                <div class="flex flex-wrap items-center gap-2">
                    <button id="btn-toggle-us" onclick="toggleManualSort('US')" class="px-3 py-1.5 rounded-xl border border-gray-700 bg-gray-800 text-gray-300 text-xs font-bold transition-all flex items-center gap-1.5">
                        <i data-lucide="lock" id="icon-us" class="w-3.5 h-3.5"></i>
                        <span id="text-us">手動排版: 鎖定</span>
                    </button>
                    <button onclick="autoFormatTable('US')" class="px-3 py-1.5 bg-gray-800 hover:bg-gray-700 text-amber-400 text-xs font-bold rounded-xl border border-amber-500/20 transition-all flex items-center gap-1">
                        <i data-lucide="wand-2" class="w-3.5 h-3.5"></i> ✨ 一鍵排版
                    </button>
                </div>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs text-gray-300">
                    <thead class="bg-gray-950 text-[10px] uppercase text-gray-400 border-b border-gray-800">
                        <tr>
                            <th class="p-4 w-10 text-center">拖曳</th>
                            <th class="p-4">代號 / 名稱</th>
                            <th class="p-4">持股數量</th>
                            <th class="p-4 text-right">平均成本 (USD)</th>
                            <th class="p-4 text-right">實時現價 (USD)</th>
                            <th class="p-4 text-right">市值 (折合HKD)</th>
                            <th class="p-4 text-right">總盈虧</th>
                            <th class="p-4 text-center">操作</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-us" class="divide-y divide-gray-800"></tbody>
                </table>
            </div>
        </div>

    </main>

    <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-3"></div>

    <!-- 核心邏輯 -->
    <script>
        lucide.createIcons();

        const stockDatabase = [
            { symbol: '2388', name: '中銀香港', market: 'HK', price: 47.94, lotSize: 500 },
            { symbol: '0700', name: '騰訊控股', market: 'HK', price: 380.0, lotSize: 100 },
            { symbol: '9988', name: '阿里巴巴-W', market: 'HK', price: 85.0, lotSize: 100 },
            { symbol: '0005', name: '匯豐控股', market: 'HK', price: 68.0, lotSize: 400 },
            { symbol: '1211', name: '比亞迪股份', market: 'HK', price: 240.0, lotSize: 500 },
            { symbol: '2282', name: '美高梅中國', market: 'HK', price: 10.75, lotSize: 1000 },
            { symbol: '2016', name: '浙商銀行', market: 'HK', price: 2.40, lotSize: 1000 },
            { symbol: 'AAPL', name: '蘋果公司 (Apple)', market: 'US', price: 220.50, lotSize: 1 },
            { symbol: 'TSLA', name: '特斯拉 (Tesla)', market: 'US', price: 245.00, lotSize: 1 },
            { symbol: 'NVDA', name: '英偉達 (NVIDIA)', market: 'US', price: 125.00, lotSize: 1 },
            { symbol: 'MSFT', name: '微軟 (Microsoft)', market: 'US', price: 420.00, lotSize: 1 },
            { symbol: 'VOO', name: '標普500 ETF (Vanguard)', market: 'US', price: 510.00, lotSize: 1 },
            { symbol: 'QQQ', name: '納指100 ETF (Invesco)', market: 'US', price: 480.00, lotSize: 1 }
        ];

        let holdingsData = [
            { symbol: '2388', name: '中銀香港', market: 'HK', hands: 1, lotSize: 500, avgCost: 37.00, currentPrice: 47.94, fee: 33.5 },
            { symbol: '2282', name: '美高梅中國', market: 'HK', hands: 1, lotSize: 1000, avgCost: 10.63, currentPrice: 10.75, fee: 31.4 },
            { symbol: 'AAPL', name: '蘋果公司 (Apple)', market: 'US', hands: 25, lotSize: 1, avgCost: 175.00, currentPrice: 220.50, fee: 1.99 }
        ];

        const exchangeRate = 7.8;
        let manualSortStates = { HK: false, US: false };
        let draggedIndex = null;
        let draggedMarket = null;
        let activeInputStock = null;

        // 老虎證券手續費自動計算函數
        function calculateTigerFee() {
            const symbolInput = document.getElementById('input-symbol').value.toUpperCase().trim();
            const sharesInput = parseFloat(document.getElementById('input-shares').value) || 0;
            const costInput = parseFloat(document.getElementById('input-cost').value) || 0;

            if (!symbolInput || sharesInput <= 0 || costInput <= 0) return;

            const isHK = /^\d+$/.test(symbolInput);
            const lotSize = activeInputStock ? activeInputStock.lotSize : (isHK ? 1000 : 1);
            const totalShares = isHK ? sharesInput * lotSize : sharesInput;
            const totalTurnover = totalShares * costInput;

            let estimatedFee = 0;

            if (isHK) {
                // 老虎港股：佣金(0.03%, 最低15) + 平台費(15) + 交易費/徵費/印花稅(約0.13%)
                const commission = Math.max(15, totalTurnover * 0.0003);
                const platform = 15;
                const regulatory = totalTurnover * 0.00133;
                estimatedFee = commission + platform + regulatory;
            } else {
                // 老虎美股：佣金($0.0049/股, 最低$0.99) + 平台費($0.005/股, 最低$1.00) + 規費
                const commission = Math.max(0.99, totalShares * 0.0049);
                const platform = Math.max(1.00, totalShares * 0.005);
                estimatedFee = commission + platform + 0.50; // 包含基礎規費
            }

            document.getElementById('input-fee').value = estimatedFee.toFixed(2);
        }

        function handleSymbolInput(query) {
            const cleanQuery = query.toUpperCase().trim();
            const dropdown = document.getElementById('symbol-dropdown');
            const marketBadge = document.getElementById('input-market-badge');
            const sharesLabel = document.getElementById('label-shares');

            if (!cleanQuery) {
                dropdown.classList.add('hidden');
                dropdown.innerHTML = '';
                marketBadge.textContent = '等待輸入代號...';
                marketBadge.className = 'text-[10px] bg-gray-800 text-gray-400 px-2 py-0.5 rounded font-bold';
                activeInputStock = null;
                return;
            }

            const isPureNumbers = /^\d+$/.test(cleanQuery);

            if (isPureNumbers) {
                marketBadge.textContent = '🇭🇰 港股 (老虎費率試算)';
                marketBadge.className = 'text-[10px] bg-amber-500/10 text-amber-400 border border-amber-500/20 px-2 py-0.5 rounded font-bold';
                sharesLabel.textContent = '持股手數 (一手單位)';
                dropdown.classList.add('hidden');

                const found = stockDatabase.find(s => s.market === 'HK' && s.symbol === cleanQuery);
                if (found) {
                    document.getElementById('input-cost').value = found.price;
                    activeInputStock = found;
                } else {
                    activeInputStock = { symbol: cleanQuery, name: `港股 ${cleanQuery}`, market: 'HK', price: 10.0, lotSize: 1000 };
                }
            } else {
                marketBadge.textContent = '🇺🇸 美股 (請選擇標的)';
                marketBadge.className = 'text-[10px] bg-blue-500/10 text-blue-400 border border-blue-500/20 px-2 py-0.5 rounded font-bold';
                sharesLabel.textContent = '持股數量 (股)';

                const matches = stockDatabase.filter(s => s.market === 'US' && (s.symbol.includes(cleanQuery) || s.name.toUpperCase().includes(cleanQuery)));

                if (matches.length > 0) {
                    dropdown.innerHTML = '';
                    dropdown.classList.remove('hidden');
                    matches.forEach(item => {
                        const div = document.createElement('div');
                        div.className = "px-3.5 py-2.5 hover:bg-gray-700 cursor-pointer text-xs text-gray-200 border-b border-gray-750 flex justify-between items-center";
                        div.innerHTML = `<span><strong class="text-blue-400 font-mono">${item.symbol}</strong> - ${item.name}</span> <span class="text-[10px] text-gray-400">參考價: $${item.price}</span>`;
                        div.onclick = () => selectStockOption(item);
                        dropdown.appendChild(div);
                    });
                } else {
                    dropdown.classList.add('hidden');
                    activeInputStock = { symbol: cleanQuery, name: cleanQuery, market: 'US', price: 100.0, lotSize: 1 };
                }
            }
            calculateTigerFee();
        }

        function selectStockOption(item) {
            document.getElementById('input-symbol').value = item.symbol;
            document.getElementById('input-cost').value = item.price;
            activeInputStock = item;
            document.getElementById('symbol-dropdown').classList.add('hidden');
            calculateTigerFee();
            showToast("智能辨識", `已選定美股 ${item.name}。`, "success");
        }

        document.addEventListener('click', (e) => {
            if (!e.target.closest('#input-symbol') && !e.target.closest('#symbol-dropdown')) {
                document.getElementById('symbol-dropdown').classList.add('hidden');
            }
        });

        function handleAddStock(e) {
            e.preventDefault();
            const symbolInput = document.getElementById('input-symbol').value.toUpperCase().trim();
            const inputVal = parseFloat(document.getElementById('input-shares').value);
            const avgCost = parseFloat(document.getElementById('input-cost').value);
            const fee = parseFloat(document.getElementById('input-fee').value) || 0;

            if (!symbolInput || isNaN(inputVal) || isNaN(avgCost)) {
                showToast("輸入錯誤", "請填寫完整的代號與數值！", "error");
                return;
            }

            const market = /^\d+$/.test(symbolInput) ? 'HK' : 'US';
            const stockInfo = activeInputStock || (market === 'HK' ? { symbol: symbolInput, name: `港股 ${symbolInput}`, market: 'HK', price: avgCost, lotSize: 1000 } : { symbol: symbolInput, name: symbolInput, market: 'US', price: avgCost, lotSize: 1 });

            const existing = holdingsData.find(h => h.symbol === stockInfo.symbol && h.market === market);

            if (existing) {
                existing.hands += inputVal;
                existing.avgCost = ((existing.hands - inputVal) * existing.avgCost + inputVal * avgCost) / existing.hands;
                existing.fee += fee;
                showToast("持股已合併", `已成功將新數值合拼入現有 ${stockInfo.symbol} 中。`, "success");
            } else {
                holdingsData.push({
                    symbol: stockInfo.symbol,
                    name: stockInfo.name,
                    market: market,
                    hands: inputVal,
                    lotSize: stockInfo.lotSize || 1,
                    avgCost: avgCost,
                    currentPrice: stockInfo.price || avgCost,
                    fee: fee
                });
                showToast("新增成功", `成功加入 ${stockInfo.symbol} (${stockInfo.name})！`, "success");
            }

            document.getElementById('input-symbol').value = '';
            document.getElementById('input-shares').value = '';
            document.getElementById('input-cost').value = '';
            document.getElementById('input-fee').value = '';
            document.getElementById('input-market-badge').textContent = '等待輸入代號...';
            document.getElementById('input-market-badge').className = 'text-[10px] bg-gray-800 text-gray-400 px-2 py-0.5 rounded font-bold';
            activeInputStock = null;

            renderTables();
        }

        function toggleManualSort(market) {
            manualSortStates[market] = !manualSortStates[market];
            const isActive = manualSortStates[market];
            const btn = document.getElementById(`btn-toggle-${market.toLowerCase()}`);
            const icon = document.getElementById(`icon-${market.toLowerCase()}`);
            const text = document.getElementById(`text-${market.toLowerCase()}`);

            if (isActive) {
                btn.className = "px-3 py-1.5 rounded-xl border border-amber-500/40 bg-amber-400 text-gray-950 text-xs font-bold transition-all flex items-center gap-1.5 shadow-md";
                icon.setAttribute('data-lucide', 'unlock');
                text.textContent = "手動排版: 開啟 (可拖曳)";
                showToast("手動模式", `${market === 'HK' ? '港股' : '美股'}已解鎖！`, "success");
            } else {
                btn.className = "px-3 py-1.5 rounded-xl border border-gray-700 bg-gray-800 text-gray-300 text-xs font-bold transition-all flex items-center gap-1.5 shadow-sm";
                icon.setAttribute('data-lucide', 'lock');
                text.textContent = "手動排版: 鎖定";
                showToast("手動模式", `${market === 'HK' ? '港股' : '美股'}已鎖定。`, "info");
            }
            renderTables();
        }

        function autoFormatTable(market) {
            const list = holdingsData.filter(h => h.market === market);
            list.sort((a, b) => {
                const totalSharesA = a.market === 'HK' ? a.hands * a.lotSize : a.hands;
                const totalSharesB = b.market === 'HK' ? b.hands * b.lotSize : b.hands;
                const valA = totalSharesA * a.currentPrice * (market === 'US' ? exchangeRate : 1);
                const valB = totalSharesB * b.currentPrice * (market === 'US' ? exchangeRate : 1);
                return valB - valA;
            });
            holdingsData = [...holdingsData.filter(h => h.market !== market), ...list];
            renderTables();
            showToast("一鍵排版", `${market === 'HK' ? '港股' : '美股'}已按市值排序！`, "success");
        }

        function adjustShares(globalIndex) {
            const h = holdingsData[globalIndex];
            const unitName = h.market === 'HK' ? '手數' : '股數';
            const input = prompt(`請輸入 ${h.symbol} 要變動的${unitName}：\n（正數增加，負數減少）`, "1");
            if (input === null) return;
            const delta = parseFloat(input);

            if (isNaN(delta) || delta === 0) {
                showToast("錯誤", "請輸入有效數字！", "error");
                return;
            }

            h.hands += delta;
            if (h.hands <= 0) {
                if (confirm(`持股已歸零，是否將 ${h.symbol} 從名單中【剷除】？`)) {
                    holdingsData.splice(globalIndex, 1);
                    showToast("已剷除", `${h.symbol} 已移除。`, "success");
                } else {
                    h.hands = 0;
                }
            } else {
                showToast("調整成功", `${h.symbol} 現有持股: ${h.hands} ${h.market === 'HK' ? '手' : '股'}`, "success");
            }
            renderTables();
        }

        function deleteHolding(globalIndex) {
            const h = holdingsData[globalIndex];
            if (confirm(`確定要將 ${h.symbol} 徹底【剷除】嗎？`)) {
                holdingsData.splice(globalIndex, 1);
                renderTables();
                showToast("已剷除", `${h.symbol} 已刪除。`, "success");
            }
        }

        function renderTables() {
            const tbodyHk = document.getElementById('tbody-hk');
            const tbodyUs = document.getElementById('tbody-us');
            tbodyHk.innerHTML = '';
            tbodyUs.innerHTML = '';

            let totalEquityHkd = 0;

            holdingsData.forEach((h, globalIndex) => {
                const isUs = h.market === 'US';
                const actualShares = isUs ? h.hands : h.hands * h.lotSize;
                const marketValRaw = actualShares * h.currentPrice;
                const marketValHkd = isUs ? marketValRaw * exchangeRate : marketValRaw;
                const costValHkd = isUs ? (actualShares * h.avgCost) * exchangeRate : (actualShares * h.avgCost);
                const pnlHkd = marketValHkd - costValHkd - (isUs ? h.fee * exchangeRate : h.fee);
                const pnlRaw = marketValRaw - (actualShares * h.avgCost) - h.fee;

                totalEquityHkd += marketValHkd;

                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-800/40 transition-colors border-b border-gray-800";
                
                const isManualActive = manualSortStates[h.market];
                if (isManualActive) {
                    tr.setAttribute('draggable', 'true');
                    tr.dataset.index = globalIndex;
                    tr.dataset.market = h.market;

                    tr.addEventListener('dragstart', handleDragStart);
                    tr.addEventListener('dragover', handleDragOver);
                    tr.addEventListener('drop', handleDrop);
                    tr.addEventListener('dragend', handleDragEnd);
                }

                tr.innerHTML = `
                    <td class="p-4 text-center text-gray-500">${isManualActive ? '<span class="cursor-grab font-bold text-amber-400 text-base" title="按住拖曳">⠿</span>' : '<span class="text-gray-700">•</span>'}</td>
                    <td class="p-4 font-bold text-white">${h.symbol}<br><span class="text-[10px] text-gray-400">${h.name}</span></td>
                    <td class="p-4 font-mono font-bold text-amber-300">
                        ${isUs ? `${h.hands.toLocaleString()} 股` : `${h.hands} 手 <span class='text-[10px] text-gray-400'>(共 ${actualShares.toLocaleString()} 股)</span>`}
                    </td>
                    <td class="p-4 text-right font-mono">${isUs ? 'US$ ' : 'HK$ '}${h.avgCost.toFixed(2)}<br><span class='text-[9px] text-gray-500'>費: ${h.fee.toFixed(2)}</span></td>
                    <td class="p-4 text-right font-mono font-bold text-emerald-400">${isUs ? 'US$ ' : 'HK$ '}${h.currentPrice.toFixed(2)}</td>
                    <td class="p-4 text-right font-mono font-bold">${isUs ? `US$ ${marketValRaw.toFixed(2)}<br><span class='text-[9px] text-gray-400'>≈ HK$ ${marketValHkd.toFixed(2)}</span>` : `HK$ ${marketValHkd.toFixed(2)}`}</td>
                    <td class="p-4 text-right font-mono ${pnlHkd >= 0 ? 'text-emerald-400' : 'text-rose-400'}">
                        ${pnlHkd >= 0 ? '+' : ''}${isUs ? `US$ ${pnlRaw.toFixed(2)}` : `HK$ ${pnlHkd.toFixed(2)}`}
                    </td>
                    <td class="p-4 text-center">
                        <div class="flex items-center justify-center gap-1.5">
                            <button onclick="adjustShares(${globalIndex})" class="px-2 py-1 bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 border border-amber-500/30 rounded-lg text-[10px] font-bold">📊 調整</button>
                            <button onclick="deleteHolding(${globalIndex})" class="px-2.5 py-1 bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/30 rounded-lg text-[10px] font-bold">🗑️ 剷除</button>
                        </div>
                    </td>
                `;

                if (isUs) {
                    tbodyUs.appendChild(tr);
                } else {
                    tbodyHk.appendChild(tr);
                }
            });

            if (tbodyHk.children.length === 0) tbodyHk.innerHTML = `<tr><td colspan="8" class="p-6 text-center text-gray-500 text-xs">暫無港股持倉紀錄</td></tr>`;
            if (tbodyUs.children.length === 0) tbodyUs.innerHTML = `<tr><td colspan="8" class="p-6 text-center text-gray-500 text-xs">暫無美股持倉紀錄</td></tr>`;

            document.getElementById('summary-equity').textContent = `HK$ ${totalEquityHkd.toLocaleString(undefined, {minimumFractionDigits: 2})}`;
            document.getElementById('summary-assets').textContent = `HK$ ${(totalEquityHkd + 66800.53).toLocaleString(undefined, {minimumFractionDigits: 2})}`;

            lucide.createIcons();
        }

        function handleDragStart(e) {
            draggedIndex = parseInt(this.dataset.index);
            draggedMarket = this.dataset.market;
            this.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
        }

        function handleDrop(e) {
            e.preventDefault();
            const targetIndex = parseInt(this.dataset.index);
            const targetMarket = this.dataset.market;

            if (isNaN(draggedIndex) || isNaN(targetIndex) || draggedMarket !== targetMarket || draggedIndex === targetIndex) return;

            const movedItem = holdingsData.splice(draggedIndex, 1)[0];
            holdingsData.splice(targetIndex, 0, movedItem);

            renderTables();
        }

        function handleDragEnd(e) {
            this.classList.remove('dragging');
            draggedIndex = null;
            draggedMarket = null;
        }

        function showToast(title, text, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = "p-3.5 rounded-xl shadow-2xl border bg-gray-900 border-gray-700 text-white text-xs flex items-center gap-2";
            toast.innerHTML = `<strong class="${type === 'success' ? 'text-emerald-400' : type === 'error' ? 'text-rose-400' : 'text-amber-400'}">${title}:</strong> <span>${text}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        window.onload = function() {
            renderTables();
        };
    </script>
</body>
</html>
