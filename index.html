<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stocker PRO Lite · 港美股分離投資大師</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #030712; color: #f3f4f6; }
        .dragging { opacity: 0.4; background-color: #1f2937 !important; }
        tr[draggable="true"] { cursor: grab; }
        tr[draggable="true"]:active { cursor: grabbing; }
    </style>
</head>
<body class="min-h-screen flex flex-col p-6 max-w-6xl mx-auto pb-16">

    <!-- 頂部標題區 -->
    <header class="flex justify-between items-center pb-6 border-b border-gray-800">
        <div>
            <h1 class="text-xl font-bold tracking-tight">STOCKER <span class="text-amber-400">PRO LITE</span></h1>
            <p class="text-xs text-gray-400">港美股分離管理與動態排版系統</p>
        </div>
        <div class="flex gap-2">
            <span class="text-xs bg-amber-500/10 text-amber-400 border border-amber-500/20 px-3 py-1.5 rounded-xl font-bold">基礎貨幣: HKD</span>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="mt-6 space-y-6 flex-grow">
        
        <!-- 資產摘要卡片 -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-gray-900 p-5 rounded-2xl border border-gray-800 shadow-lg">
                <p class="text-xs text-gray-400 uppercase font-bold">總資產淨值 (含現金)</p>
                <h3 class="text-2xl font-extrabold text-white mt-1" id="summary-assets">HK$ 0.00</h3>
            </div>
            <div class="bg-gray-900 p-5 rounded-2xl border border-gray-800 shadow-lg">
                <p class="text-xs text-gray-400 uppercase font-bold">持股股票總市值</p>
                <h3 class="text-2xl font-extrabold text-emerald-400 mt-1" id="summary-equity">HK$ 0.00</h3>
            </div>
            <div class="bg-gray-900 p-5 rounded-2xl border border-gray-800 shadow-lg">
                <p class="text-xs text-gray-400 uppercase font-bold">可用現金儲備</p>
                <h3 class="text-2xl font-extrabold text-amber-400 mt-1" id="summary-cash">HK$ 66,800.53</h3>
            </div>
        </div>

        <!-- 新增股票輸入表單卡片 -->
        <div class="bg-gradient-to-br from-gray-900 to-gray-950 p-5 rounded-2xl border border-amber-500/30 shadow-xl space-y-4">
            <div class="border-b border-gray-800 pb-2 flex items-center gap-2">
                <i data-lucide="plus-circle" class="w-4 h-4 text-amber-400"></i>
                <h3 class="text-xs font-bold text-white uppercase tracking-wider">新增持股輸入表單 (港股 / 美股)</h3>
            </div>
            <form onsubmit="handleAddStock(event)" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-6 gap-3 items-end">
                <div>
                    <label class="block text-[10px] font-bold text-gray-400 mb-1">交易市場</label>
                    <select id="input-market" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-amber-400">
                        <option value="HK">🇭🇰 港股 (HKD)</option>
                        <option value="US">🇺🇸 美股 (USD)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-gray-400 mb-1">股票代號</label>
                    <input type="text" id="input-symbol" placeholder="例: 0700 或 AAPL" required class="w-full bg-gray-800 border border-gray-700 rounded-xl px-3 py-2 text-xs text-white uppercase focus:outline-none focus:border-amber-400">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-gray-400 mb-1">股票名稱</label>
                    <input type="text" id="input-name" placeholder="例: 騰訊 / 蘋果" required class="w-full bg-gray-800 border border-gray-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-amber-400">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-gray-400 mb-1">持股數量</label>
                    <input type="number" step="any" id="input-shares" placeholder="例: 500" required class="w-full bg-gray-800 border border-gray-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-amber-400">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-gray-400 mb-1">平均成本</label>
                    <input type="number" step="any" id="input-cost" placeholder="例: 350.0" required class="w-full bg-gray-800 border border-gray-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-amber-400">
                </div>
                <div>
                    <button type="submit" class="w-full py-2.5 bg-amber-400 hover:bg-amber-500 text-gray-950 font-bold text-xs rounded-xl transition-all shadow-md flex items-center justify-center gap-1">
                        <i data-lucide="check" class="w-3.5 h-3.5"></i> 確認新增持股
                    </button>
                </div>
            </form>
        </div>

        <!-- ==================== 🇭🇰 港股持倉區塊 ==================== -->
        <div class="bg-gray-900 rounded-2xl border border-gray-800 shadow-xl overflow-hidden">
            <div class="p-5 border-b border-gray-800 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-gray-950/30">
                <div class="flex items-center gap-2">
                    <span class="text-base">🇭🇰</span>
                    <h3 class="text-sm font-bold text-white">港股持倉名單</h3>
                </div>
                <div class="flex flex-wrap items-center gap-2">
                    <button id="btn-toggle-hk" onclick="toggleManualSort('HK')" class="px-3 py-1.5 rounded-xl border border-gray-700 bg-gray-800 text-gray-300 text-xs font-bold transition-all flex items-center gap-1.5">
                        <i data-lucide="lock" id="icon-hk" class="w-3.5 h-3.5"></i>
                        <span id="text-hk">手動排版: 鎖定</span>
                    </button>
                    <button onclick="autoFormatTable('HK')" class="px-3 py-1.5 bg-gray-800 hover:bg-gray-700 text-amber-400 text-xs font-bold rounded-xl border border-amber-500/20 transition-all flex items-center gap-1">
                        <i data-lucide="wand-2" class="w-3.5 h-3.5"></i> ✨ 一鍵排版
                    </button>
                </div>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs text-gray-300">
                    <thead class="bg-gray-950 text-[10px] uppercase text-gray-400 border-b border-gray-800">
                        <tr>
                            <th class="p-4 w-10 text-center">拖曳</th>
                            <th class="p-4">代號 / 名稱</th>
                            <th class="p-4">持股量</th>
                            <th class="p-4 text-right">平均成本 (HKD)</th>
                            <th class="p-4 text-right">實時現價 (HKD)</th>
                            <th class="p-4 text-right">市值</th>
                            <th class="p-4 text-right">總盈虧</th>
                            <th class="p-4 text-center">操作</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-hk" class="divide-y divide-gray-800"></tbody>
                </table>
            </div>
        </div>

        <!-- ==================== 🇺🇸 美股持倉區塊 ==================== -->
        <div class="bg-gray-900 rounded-2xl border border-gray-800 shadow-xl overflow-hidden">
            <div class="p-5 border-b border-gray-800 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-gray-950/30">
                <div class="flex items-center gap-2">
                    <span class="text-base">🇺🇸</span>
                    <h3 class="text-sm font-bold text-white">美股持倉名單</h3>
                </div>
                <div class="flex flex-wrap items-center gap-2">
                    <button id="btn-toggle-us" onclick="toggleManualSort('US')" class="px-3 py-1.5 rounded-xl border border-gray-700 bg-gray-800 text-gray-300 text-xs font-bold transition-all flex items-center gap-1.5">
                        <i data-lucide="lock" id="icon-us" class="w-3.5 h-3.5"></i>
                        <span id="text-us">手動排版: 鎖定</span>
                    </button>
                    <button onclick="autoFormatTable('US')" class="px-3 py-1.5 bg-gray-800 hover:bg-gray-700 text-amber-400 text-xs font-bold rounded-xl border border-amber-500/20 transition-all flex items-center gap-1">
                        <i data-lucide="wand-2" class="w-3.5 h-3.5"></i> ✨ 一鍵排版
                    </button>
                </div>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs text-gray-300">
                    <thead class="bg-gray-950 text-[10px] uppercase text-gray-400 border-b border-gray-800">
                        <tr>
                            <th class="p-4 w-10 text-center">拖曳</th>
                            <th class="p-4">代號 / 名稱</th>
                            <th class="p-4">持股量</th>
                            <th class="p-4 text-right">平均成本 (USD)</th>
                            <th class="p-4 text-right">實時現價 (USD)</th>
                            <th class="p-4 text-right">市值 (折合HKD)</th>
                            <th class="p-4 text-right">總盈虧</th>
                            <th class="p-4 text-center">操作</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-us" class="divide-y divide-gray-800"></tbody>
                </table>
            </div>
        </div>

    </main>

    <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-3"></div>

    <!-- 核心邏輯 -->
    <script>
        lucide.createIcons();

        // 統一資料結構，以 market 分開 'HK' 或 'US'
        let holdingsData = [
            { symbol: '2388', name: '中銀香港', market: 'HK', shares: 500, avgCost: 37.00, currentPrice: 47.94 },
            { symbol: '2282', name: '美高梅中國', market: 'HK', shares: 1000, avgCost: 10.63, currentPrice: 10.75 },
            { symbol: 'AAPL', name: '蘋果公司', market: 'US', shares: 25, avgCost: 175.00, currentPrice: 220.50 }
        ];

        const exchangeRate = 7.8; // USD to HKD
        let manualSortStates = { HK: false, US: false };
        let draggedIndex = null;
        let draggedMarket = null;

        // 處理新增股票表單提交
        function handleAddStock(e) {
            e.preventDefault();
            const market = document.getElementById('input-market').value;
            const symbol = document.getElementById('input-symbol').value.toUpperCase().trim();
            const name = document.getElementById('input-name').value.trim();
            const shares = parseFloat(document.getElementById('input-shares').value);
            const avgCost = parseFloat(document.getElementById('input-cost').value);

            if (!symbol || isNaN(shares) || isNaN(avgCost)) {
                showToast("輸入錯誤", "請填寫有效的股票資料！", "error");
                return;
            }

            // 檢查是否已存在
            const existing = holdingsData.find(h => h.symbol === symbol && h.market === market);
            if (existing) {
                existing.shares += shares;
                existing.avgCost = ((existing.shares - shares) * existing.avgCost + shares * avgCost) / existing.shares;
                showToast("持股已合併", `已自動將新買入的 ${shares} 股合拼入現有 ${symbol} 中。`, "success");
            } else {
                holdingsData.push({
                    symbol, name, market, shares, avgCost, currentPrice: avgCost // 預設現價等於成本
                });
                showToast("新增成功", `成功加入 ${symbol} (${name}) 至 ${market === 'HK' ? '港股' : '美股'} 列表！`, "success");
            }

            // 重置表單
            document.getElementById('input-symbol').value = '';
            document.getElementById('input-name').value = '';
            document.getElementById('input-shares').value = '';
            document.getElementById('input-cost').value = '';

            renderTables();
        }

        // 切換手動排版開關
        function toggleManualSort(market) {
            manualSortStates[market] = !manualSortStates[market];
            const isActive = manualSortStates[market];
            const btn = document.getElementById(`btn-toggle-${market.toLowerCase()}`);
            const icon = document.getElementById(`icon-${market.toLowerCase()}`);
            const text = document.getElementById(`text-${market.toLowerCase()}`);

            if (isActive) {
                btn.className = "px-3 py-1.5 rounded-xl border border-amber-500/40 bg-amber-400 text-gray-950 text-xs font-bold transition-all flex items-center gap-1.5 shadow-md";
                icon.setAttribute('data-lucide', 'unlock');
                text.textContent = "手動排版: 開啟 (可拖曳)";
                showToast("手動模式", `${market === 'HK' ? '港股' : '美股'}已解鎖！可直接用滑鼠拖曳排序。`, "success");
            } else {
                btn.className = "px-3 py-1.5 rounded-xl border border-gray-700 bg-gray-800 text-gray-300 text-xs font-bold transition-all flex items-center gap-1.5 shadow-sm";
                icon.setAttribute('data-lucide', 'lock');
                text.textContent = "手動排版: 鎖定";
                showToast("手動模式", `${market === 'HK' ? '港股' : '美股'}已鎖定。`, "info");
            }
            renderTables();
        }

        // 一鍵排版 (按市值由高至低)
        function autoFormatTable(market) {
            const list = holdingsData.filter(h => h.market === market);
            list.sort((a, b) => {
                const valA = a.shares * a.currentPrice * (market === 'US' ? exchangeRate : 1);
                const valB = b.shares * b.currentPrice * (market === 'US' ? exchangeRate : 1);
                return valB - valA;
            });
            // 重新組合 holdingsData
            holdingsData = [...holdingsData.filter(h => h.market !== market), ...list];
            renderTables();
            showToast("一鍵排版", `${market === 'HK' ? '港股' : '美股'}已按市值由高至低重新排序！`, "success");
        }

        // 調整持股數量
        function adjustShares(globalIndex) {
            const h = holdingsData[globalIndex];
            const input = prompt(`請輸入 ${h.symbol} (${h.name}) 要變動的股數：\n（正數代表增加，負數代表減少，例: 100 或 -50）`, "100");
            if (input === null) return;
            const delta = parseFloat(input);

            if (isNaN(delta) || delta === 0) {
                showToast("錯誤", "請輸入有效數字！", "error");
                return;
            }

            h.shares += delta;
            if (h.shares <= 0) {
                if (confirm(`持股已歸零，是否順便將 ${h.symbol} 從名單中【剷除】？`)) {
                    holdingsData.splice(globalIndex, 1);
                    showToast("已剷除", `${h.symbol} 已移除。`, "success");
                } else {
                    h.shares = 0;
                }
            } else {
                showToast("調整成功", `${h.symbol} 現有持股: ${h.shares} 股`, "success");
            }
            renderTables();
        }

        // 剷除持股
        function deleteHolding(globalIndex) {
            const h = holdingsData[globalIndex];
            if (confirm(`確定要將 ${h.symbol} (${h.name}) 從持倉中徹底【剷除】嗎？`)) {
                holdingsData.splice(globalIndex, 1);
                renderTables();
                showToast("已剷除", `${h.symbol} 已刪除。`, "success");
            }
        }

        // 渲染兩個表格與資產摘要
        function renderTables() {
            const tbodyHk = document.getElementById('tbody-hk');
            const tbodyUs = document.getElementById('tbody-us');
            tbodyHk.innerHTML = '';
            tbodyUs.innerHTML = '';

            let totalEquityHkd = 0;

            holdingsData.forEach((h, globalIndex) => {
                const isUs = h.market === 'US';
                const marketValRaw = h.shares * h.currentPrice;
                const marketValHkd = isUs ? marketValRaw * exchangeRate : marketValRaw;
                const costValHkd = isUs ? (h.shares * h.avgCost) * exchangeRate : (h.shares * h.avgCost);
                const pnlHkd = marketValHkd - costValHkd;
                const pnlRaw = marketValRaw - (h.shares * h.avgCost);

                totalEquityHkd += marketValHkd;

                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-800/40 transition-colors border-b border-gray-800";
                
                const isManualActive = manualSortStates[h.market];
                if (isManualActive) {
                    tr.setAttribute('draggable', 'true');
                    tr.dataset.index = globalIndex;
                    tr.dataset.market = h.market;

                    tr.addEventListener('dragstart', handleDragStart);
                    tr.addEventListener('dragover', handleDragOver);
                    tr.addEventListener('drop', handleDrop);
                    tr.addEventListener('dragend', handleDragEnd);
                }

                tr.innerHTML = `
                    <td class="p-4 text-center text-gray-500">${isManualActive ? '<span class="cursor-grab font-bold text-amber-400 text-base" title="按住拖曳">⠿</span>' : '<span class="text-gray-700">•</span>'}</td>
                    <td class="p-4 font-bold text-white">${h.symbol}<br><span class="text-[10px] text-gray-400">${h.name}</span></td>
                    <td class="p-4 font-mono font-bold text-amber-300">${h.shares.toLocaleString()} 股</td>
                    <td class="p-4 text-right font-mono">${isUs ? 'US$ ' : 'HK$ '}${h.avgCost.toFixed(2)}</td>
                    <td class="p-4 text-right font-mono font-bold text-emerald-400">${isUs ? 'US$ ' : 'HK$ '}${h.currentPrice.toFixed(2)}</td>
                    <td class="p-4 text-right font-mono font-bold">${isUs ? `US$ ${marketValRaw.toFixed(2)}<br><span class='text-[9px] text-gray-400'>≈ HK$ ${marketValHkd.toFixed(2)}</span>` : `HK$ ${marketValHkd.toFixed(2)}`}</td>
                    <td class="p-4 text-right font-mono ${pnlHkd >= 0 ? 'text-emerald-400' : 'text-rose-400'}">
                        ${pnlHkd >= 0 ? '+' : ''}${isUs ? `US$ ${pnlRaw.toFixed(2)}` : `HK$ ${pnlHkd.toFixed(2)}`}
                    </td>
                    <td class="p-4 text-center">
                        <div class="flex items-center justify-center gap-1.5">
                            <button onclick="adjustShares(${globalIndex})" class="px-2 py-1 bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 border border-amber-500/30 rounded-lg text-[10px] font-bold">📊 調整</button>
                            <button onclick="deleteHolding(${globalIndex})" class="px-2.5 py-1 bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/30 rounded-lg text-[10px] font-bold">🗑️ 剷除</button>
                        </div>
                    </td>
                `;

                if (isUs) {
                    tbodyUs.appendChild(tr);
                } else {
                    tbodyHk.appendChild(tr);
                }
            });

            if (tbodyHk.children.length === 0) {
                tbodyHk.innerHTML = `<tr><td colspan="8" class="p-6 text-center text-gray-500 text-xs">暫無港股持倉紀錄</td></tr>`;
            }
            if (tbodyUs.children.length === 0) {
                tbodyUs.innerHTML = `<tr><td colspan="8" class="p-6 text-center text-gray-500 text-xs">暫無美股持倉紀錄</td></tr>`;
            }

            // 更新頂部資產總結
            document.getElementById('summary-equity').textContent = `HK$ ${totalEquityHkd.toLocaleString(undefined, {minimumFractionDigits: 2})}`;
            document.getElementById('summary-assets').textContent = `HK$ ${(totalEquityHkd + 66800.53).toLocaleString(undefined, {minimumFractionDigits: 2})}`;

            lucide.createIcons();
        }

        // 拖曳事件處理 (支援跨市場防護)
        function handleDragStart(e) {
            draggedIndex = parseInt(this.dataset.index);
            draggedMarket = this.dataset.market;
            this.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
        }

        function handleDrop(e) {
            e.preventDefault();
            const targetIndex = parseInt(this.dataset.index);
            const targetMarket = this.dataset.market;

            if (isNaN(draggedIndex) || isNaN(targetIndex) || draggedMarket !== targetMarket || draggedIndex === targetIndex) return;

            const movedItem = holdingsData.splice(draggedIndex, 1)[0];
            // 尋找目標在全域陣列中的新位置
            let newTargetIndex = holdingsData.findIndex((h, idx) => idx >= 0 && h.market === targetMarket);
            holdingsData.splice(targetIndex, 0, movedItem);

            renderTables();
        }

        function handleDragEnd(e) {
            this.classList.remove('dragging');
            draggedIndex = null;
            draggedMarket = null;
        }

        function showToast(title, text, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = "p-3.5 rounded-xl shadow-2xl border bg-gray-900 border-gray-700 text-white text-xs flex items-center gap-2";
            toast.innerHTML = `<strong class="${type === 'success' ? 'text-emerald-400' : type === 'error' ? 'text-rose-400' : 'text-amber-400'}">${title}:</strong> <span>${text}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        window.onload = function() {
            renderTables();
        };
    </script>
</body>
</html>
