<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stocker PRO Lite · 拖曳排序投資大師</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #030712; color: #f3f4f6; }
        /* 拖曳時的樣式 */
        .dragging { opacity: 0.4; background-color: #1f2937 !important; }
        tr[draggable="true"] { cursor: grab; }
        tr[draggable="true"]:active { cursor: grabbing; }
    </style>
</head>
<body class="min-h-screen flex flex-col p-6 max-w-6xl mx-auto">

    <!-- 頂部標題區 -->
    <header class="flex justify-between items-center pb-6 border-b border-gray-800">
        <div>
            <h1 class="text-xl font-bold tracking-tight">STOCKER <span class="text-amber-400">PRO LITE</span></h1>
            <p class="text-xs text-gray-400">支援滑鼠拖曳排序與自動排版系統</p>
        </div>
        <div class="flex gap-2">
            <span class="text-xs bg-amber-500/10 text-amber-400 border border-amber-500/20 px-3 py-1.5 rounded-xl font-bold">基礎貨幣: HKD</span>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="mt-6 space-y-6 flex-grow">
        
        <!-- 資產摘要卡片 -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-gray-900 p-5 rounded-2xl border border-gray-800 shadow-lg">
                <p class="text-xs text-gray-400 uppercase font-bold">總資產淨值</p>
                <h3 class="text-2xl font-extrabold text-white mt-1" id="summary-assets">HK$ 0.00</h3>
            </div>
            <div class="bg-gray-900 p-5 rounded-2xl border border-gray-800 shadow-lg">
                <p class="text-xs text-gray-400 uppercase font-bold">持倉股票市值</p>
                <h3 class="text-2xl font-extrabold text-emerald-400 mt-1" id="summary-equity">HK$ 0.00</h3>
            </div>
            <div class="bg-gray-900 p-5 rounded-2xl border border-gray-800 shadow-lg">
                <p class="text-xs text-gray-400 uppercase font-bold">可用現金儲備</p>
                <h3 class="text-2xl font-extrabold text-amber-400 mt-1" id="summary-cash">HK$ 66,800.53</h3>
            </div>
        </div>

        <!-- 持倉表格與控制列 -->
        <div class="bg-gray-900 rounded-2xl border border-gray-800 shadow-xl overflow-hidden">
            <div class="p-5 border-b border-gray-800 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                <div class="flex items-center gap-2">
                    <i data-lucide="briefcase" class="w-4 h-4 text-amber-400"></i>
                    <h3 class="text-sm font-bold text-white">當前持股庫存 <span class="text-[10px] text-gray-400 font-normal">(可直接用滑鼠按住整行拖曳排序)</span></h3>
                </div>
                
                <!-- 手動 / 自動排版控制列 -->
                <div class="flex items-center gap-2">
                    <div class="flex bg-gray-950 p-1 rounded-xl border border-gray-800 text-xs">
                        <button id="btn-mode-manual" onclick="setSortMode('manual')" class="px-3 py-1 rounded-lg bg-amber-400 text-gray-950 font-bold transition-all">手動 (可拖曳)</button>
                        <button id="btn-mode-auto" onclick="setSortMode('auto')" class="px-3 py-1 rounded-lg text-gray-400 transition-all">自動排版</button>
                    </div>
                    <button onclick="autoFormatHoldingsTable()" class="px-3 py-1.5 bg-gray-800 hover:bg-gray-700 text-amber-400 text-xs font-bold rounded-xl border border-amber-500/20 transition-all flex items-center gap-1">
                        <i data-lucide="wand-2" class="w-3.5 h-3.5"></i> 一鍵排版
                    </button>
                </div>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs text-gray-300">
                    <thead class="bg-gray-950 text-[10px] uppercase text-gray-400 border-b border-gray-800">
                        <tr>
                            <th class="p-4 w-8 text-center">⠿</th>
                            <th class="p-4">股票代號</th>
                            <th class="p-4">持股量</th>
                            <th class="p-4 text-right">平均成本</th>
                            <th class="p-4 text-right">實時現價</th>
                            <th class="p-4 text-right">市值</th>
                            <th class="p-4 text-right">總盈虧</th>
                        </tr>
                    </thead>
                    <tbody id="holdings-tbody" class="divide-y divide-gray-800">
                        <!-- 動態載入 -->
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- 拖曳排序與核心邏輯 -->
    <script>
        lucide.createIcons();

        let holdingsData = [
            { symbol: '2388', name: '中銀香港', shares: 500, avgCost: 37.00, currentPrice: 47.94 },
            { symbol: '2282', name: '美高梅中國', shares: 1000, avgCost: 10.63, currentPrice: 10.75 },
            { symbol: '2016', name: '浙商銀行', shares: 1000, avgCost: 2.24, currentPrice: 2.40 }
        ];

        let sortMode = 'manual'; // 'manual' 或 'auto'
        let draggedIndex = null;

        function setSortMode(mode) {
            sortMode = mode;
            const manualBtn = document.getElementById('btn-mode-manual');
            const autoBtn = document.getElementById('btn-mode-auto');

            if (mode === 'manual') {
                manualBtn.className = "px-3 py-1 rounded-lg bg-amber-400 text-gray-950 font-bold transition-all";
                autoBtn.className = "px-3 py-1 rounded-lg text-gray-400 transition-all";
                renderTable(); // 重新渲染以恢復可拖曳屬性
            } else {
                autoBtn.className = "px-3 py-1 rounded-lg bg-amber-400 text-gray-950 font-bold transition-all";
                manualBtn.className = "px-3 py-1 rounded-lg text-gray-400 transition-all";
                autoFormatHoldingsTable();
            }
        }

        // 自動排版（市值由大到小）
        function autoFormatHoldingsTable() {
            holdingsData.sort((a, b) => (b.shares * b.currentPrice) - (a.shares * a.currentPrice));
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('holdings-tbody');
            tbody.innerHTML = '';

            let totalEquity = 0;

            holdingsData.forEach((h, index) => {
                const marketVal = h.shares * h.currentPrice;
                const costVal = h.shares * h.avgCost;
                const pnl = marketVal - costVal;
                totalEquity += marketVal;

                const tr = document.createElement('tr');
                tr.className = (index % 2 === 0 ? "bg-gray-900/40" : "bg-gray-950/20") + " hover:bg-gray-800/40 transition-colors";
                
                // 只有在手動模式下才允許拖曳
                if (sortMode === 'manual') {
                    tr.setAttribute('draggable', 'true');
                    tr.dataset.index = index;

                    // 綁定拖曳事件
                    tr.addEventListener('dragstart', handleDragStart);
                    tr.addEventListener('dragover', handleDragOver);
                    tr.addEventListener('drop', handleDrop);
                    tr.addEventListener('dragend', handleDragEnd);
                }

                tr.innerHTML = `
                    <td class="p-4 text-center text-gray-600 cursor-grab">${sortMode === 'manual' ? '⠿' : '•'}</td>
                    <td class="p-4 font-bold text-white">${h.symbol}<br><span class="text-[10px] text-gray-400">${h.name}</span></td>
                    <td class="p-4">${h.shares} 股</td>
                    <td class="p-4 text-right">HK$ ${h.avgCost.toFixed(2)}</td>
                    <td class="p-4 text-right font-bold text-emerald-400">HK$ ${h.currentPrice.toFixed(2)}</td>
                    <td class="p-4 text-right font-mono font-bold">HK$ ${marketVal.toFixed(2)}</td>
                    <td class="p-4 text-right font-mono ${pnl >= 0 ? 'text-emerald-400' : 'text-rose-400'}">${pnl >= 0 ? '+' : ''}${pnl.toFixed(2)}</td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('summary-equity').textContent = `HK$ ${totalEquity.toLocaleString(undefined, {minimumFractionDigits: 2})}`;
            document.getElementById('summary-assets').textContent = `HK$ ${(totalEquity + 66800.53).toLocaleString(undefined, {minimumFractionDigits: 2})}`;

            lucide.createIcons();
        }

        // --- 拖曳事件處理函數 ---
        function handleDragStart(e) {
            draggedIndex = parseInt(this.dataset.index);
            this.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
        }

        function handleDragOver(e) {
            e.preventDefault(); // 必須阻止預設行為才能觸發 drop
            e.dataTransfer.dropEffect = 'move';
        }

        function handleDrop(e) {
            e.preventDefault();
            const targetIndex = parseInt(this.dataset.index);

            if (isNaN(draggedIndex) || isNaN(targetIndex) || draggedIndex === targetIndex) return;

            // 調整陣列順序
            const movedItem = holdingsData.splice(draggedIndex, 1)[0];
            holdingsData.splice(targetIndex, 0, movedItem);

            renderTable();
        }

        function handleDragEnd(e) {
            this.classList.remove('dragging');
            draggedIndex = null;
        }

        // 初始化
        window.onload = function() {
            renderTable();
        };
    </script>
</body>
</html>
