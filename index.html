<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stocker PRO Lite · 輕量化投資大師</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #030712; color: #f3f4f6; }
        .dragging { opacity: 0.4; background-color: #1f2937 !important; }
        tr[draggable="true"] { cursor: grab; }
        tr[draggable="true"]:active { cursor: grabbing; }
    </style>
</head>
<body class="min-h-screen flex flex-col p-6 max-w-6xl mx-auto">

    <!-- 頂部標題區 -->
    <header class="flex justify-between items-center pb-6 border-b border-gray-800">
        <div>
            <h1 class="text-xl font-bold tracking-tight">STOCKER <span class="text-amber-400">PRO LITE</span></h1>
            <p class="text-xs text-gray-400">輕量化投資組合與動態排版系統</p>
        </div>
        <div class="flex gap-2">
            <span class="text-xs bg-amber-500/10 text-amber-400 border border-amber-500/20 px-3 py-1.5 rounded-xl font-bold">基礎貨幣: HKD</span>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="mt-6 space-y-6 flex-grow">
        
        <!-- 資產摘要卡片 -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-gray-900 p-5 rounded-2xl border border-gray-800 shadow-lg">
                <p class="text-xs text-gray-400 uppercase font-bold">總資產淨值</p>
                <h3 class="text-2xl font-extrabold text-white mt-1" id="summary-assets">HK$ 0.00</h3>
            </div>
            <div class="bg-gray-900 p-5 rounded-2xl border border-gray-800 shadow-lg">
                <p class="text-xs text-gray-400 uppercase font-bold">持倉股票市值</p>
                <h3 class="text-2xl font-extrabold text-emerald-400 mt-1" id="summary-equity">HK$ 0.00</h3>
            </div>
            <div class="bg-gray-900 p-5 rounded-2xl border border-gray-800 shadow-lg">
                <p class="text-xs text-gray-400 uppercase font-bold">可用現金儲備</p>
                <h3 class="text-2xl font-extrabold text-amber-400 mt-1" id="summary-cash">HK$ 66,800.53</h3>
            </div>
        </div>

        <!-- 持倉表格與控制列 -->
        <div class="bg-gray-900 rounded-2xl border border-gray-800 shadow-xl overflow-hidden">
            <div class="p-5 border-b border-gray-800 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                <div class="flex items-center gap-2">
                    <i data-lucide="briefcase" class="w-4 h-4 text-amber-400"></i>
                    <h3 class="text-sm font-bold text-white">當前持股庫存</h3>
                </div>
                
                <!-- 功能按鈕區：手動排版開關 + 一鍵排版 -->
                <div class="flex flex-wrap items-center gap-2">
                    <button id="btn-toggle-manual" onclick="toggleManualSort()" class="px-3 py-1.5 rounded-xl border border-gray-700 bg-gray-800 text-gray-300 text-xs font-bold transition-all flex items-center gap-1.5 shadow-sm">
                        <i data-lucide="lock" id="manual-icon" class="w-3.5 h-3.5"></i>
                        <span id="manual-text">手動排版: 關閉 (鎖定)</span>
                    </button>

                    <button onclick="autoFormatHoldingsTable()" class="px-3 py-1.5 bg-gray-800 hover:bg-gray-700 text-amber-400 text-xs font-bold rounded-xl border border-amber-500/20 transition-all flex items-center gap-1.5 shadow-sm">
                        <i data-lucide="wand-2" class="w-3.5 h-3.5"></i>
                        <span>✨ 一鍵排版</span>
                    </button>
                </div>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs text-gray-300">
                    <thead class="bg-gray-950 text-[10px] uppercase text-gray-400 border-b border-gray-800">
                        <tr>
                            <th class="p-4 w-10 text-center">拖曳</th>
                            <th class="p-4">股票代號</th>
                            <th class="p-4">持股量</th>
                            <th class="p-4 text-right">平均成本</th>
                            <th class="p-4 text-right">實時現價</th>
                            <th class="p-4 text-right">市值</th>
                            <th class="p-4 text-right">總盈虧</th>
                            <th class="p-4 text-center">操作 (調整/剷除)</th>
                        </tr>
                    </thead>
                    <tbody id="holdings-tbody" class="divide-y divide-gray-800">
                        <!-- 動態載入 -->
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- 提示框容器 -->
    <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-3"></div>

    <!-- 核心邏輯 -->
    <script>
        lucide.createIcons();

        let holdingsData = [
            { symbol: '2388', name: '中銀香港', shares: 500, avgCost: 37.00, currentPrice: 47.94 },
            { symbol: '2282', name: '美高梅中國', shares: 1000, avgCost: 10.63, currentPrice: 10.75 },
            { symbol: '2016', name: '浙商銀行', shares: 1000, avgCost: 2.24, currentPrice: 2.40 }
        ];

        let isManualSortEnabled = false;
        let draggedIndex = null;

        function toggleManualSort() {
            isManualSortEnabled = !isManualSortEnabled;
            const btn = document.getElementById('btn-toggle-manual');
            const icon = document.getElementById('manual-icon');
            const text = document.getElementById('manual-text');

            if (isManualSortEnabled) {
                btn.className = "px-3 py-1.5 rounded-xl border border-amber-500/40 bg-amber-400 text-gray-950 text-xs font-bold transition-all flex items-center gap-1.5 shadow-md";
                icon.setAttribute('data-lucide', 'unlock');
                text.textContent = "手動排版: 開啟 (可拖曳)";
                showToast("手動模式", "已開啟！你而家可以直接用滑鼠按住整行上下拖曳調整順序。", "success");
            } else {
                btn.className = "px-3 py-1.5 rounded-xl border border-gray-700 bg-gray-800 text-gray-300 text-xs font-bold transition-all flex items-center gap-1.5 shadow-sm";
                icon.setAttribute('data-lucide', 'lock');
                text.textContent = "手動模式: 關閉 (鎖定)";
                showToast("手動模式", "已鎖定！表格順序已固定。", "info");
            }
            renderTable();
        }

        function autoFormatHoldingsTable() {
            holdingsData.sort((a, b) => (b.shares * b.currentPrice) - (a.shares * a.currentPrice));
            renderTable();
            showToast("一鍵排版", "已自動按市值由高至低重新排列完成！", "success");
        }

        // 新增：調整持股數目（增加或減少）
        function adjustShares(index) {
            const h = holdingsData[index];
            const input = prompt(`請輸入 ${h.symbol} (${h.name}) 要變動的股數：\n（提示：輸入正數代表增加，輸入負數代表減少，例如輸入 100 或 -50）`, "100");
            
            if (input === null) return; // 用戶按取消
            const delta = parseFloat(input);

            if (isNaN(delta) || delta === 0) {
                showToast("錯誤", "請輸入有效的數字！", "error");
                return;
            }

            h.shares += delta;

            if (h.shares <= 0) {
                if (confirm(`持股數目已歸零或為負，是否順便將 ${h.symbol} 從名單中【剷除】？`)) {
                    holdingsData.splice(index, 1);
                    showToast("剷除成功", `${h.symbol} 已順利移除。`, "success");
                } else {
                    h.shares = 0;
                }
            } else {
                showToast("調整成功", `${h.symbol} 現時持股已更新為 ${h.shares} 股。`, "success");
            }

            renderTable();
        }

        // 新增：直接剷除持股
        function deleteHolding(index) {
            const h = holdingsData[index];
            if (confirm(`確定要將 ${h.symbol} (${h.name}) 從持倉中徹底【剷除】嗎？`)) {
                holdingsData.splice(index, 1);
                renderTable();
                showToast("已剷除", `${h.symbol} 已成功刪除。`, "success");
            }
        }

        function renderTable() {
            const tbody = document.getElementById('holdings-tbody');
            tbody.innerHTML = '';

            let totalEquity = 0;

            if (holdingsData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="p-8 text-center text-gray-500">目前沒有任何持股紀錄</td></tr>`;
                document.getElementById('summary-equity').textContent = `HK$ 0.00`;
                document.getElementById('summary-assets').textContent = `HK$ 66,800.53`;
                return;
            }

            holdingsData.forEach((h, index) => {
                const marketVal = h.shares * h.currentPrice;
                const costVal = h.shares * h.avgCost;
                const pnl = marketVal - costVal;
                totalEquity += marketVal;

                const tr = document.createElement('tr');
                tr.className = (index % 2 === 0 ? "bg-gray-900/40" : "bg-gray-950/20") + " hover:bg-gray-800/40 transition-colors";
                
                if (isManualSortEnabled) {
                    tr.setAttribute('draggable', 'true');
                    tr.dataset.index = index;

                    tr.addEventListener('dragstart', handleDragStart);
                    tr.addEventListener('dragover', handleDragOver);
                    tr.addEventListener('drop', handleDrop);
                    tr.addEventListener('dragend', handleDragEnd);
                }

                tr.innerHTML = `
                    <td class="p-4 text-center text-gray-500">${isManualSortEnabled ? '<span class="cursor-grab font-bold text-amber-400 text-base" title="按住拖曳">⠿</span>' : '<span class="text-gray-700">•</span>'}</td>
                    <td class="p-4 font-bold text-white">${h.symbol}<br><span class="text-[10px] text-gray-400">${h.name}</span></td>
                    <td class="p-4 font-mono font-bold text-amber-300">${h.shares.toLocaleString()} 股</td>
                    <td class="p-4 text-right">HK$ ${h.avgCost.toFixed(2)}</td>
                    <td class="p-4 text-right font-bold text-emerald-400">HK$ ${h.currentPrice.toFixed(2)}</td>
                    <td class="p-4 text-right font-mono font-bold">HK$ ${marketVal.toFixed(2)}</td>
                    <td class="p-4 text-right font-mono ${pnl >= 0 ? 'text-emerald-400' : 'text-rose-400'}">${pnl >= 0 ? '+' : ''}${pnl.toFixed(2)}</td>
                    <td class="p-4 text-center">
                        <div class="flex items-center justify-center gap-1.5">
                            <button onclick="adjustShares(${index})" class="px-2.5 py-1 bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 border border-amber-500/30 rounded-lg text-[11px] font-bold transition-all">
                                📊 調整
                            </button>
                            <button onclick="deleteHolding(${index})" class="px-2.5 py-1 bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/30 rounded-lg text-[11px] font-bold transition-all">
                                🗑️ 剷除
                            </button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('summary-equity').textContent = `HK$ ${totalEquity.toLocaleString(undefined, {minimumFractionDigits: 2})}`;
            document.getElementById('summary-assets').textContent = `HK$ ${(totalEquity + 66800.53).toLocaleString(undefined, {minimumFractionDigits: 2})}`;

            lucide.createIcons();
        }

        // 拖曳事件處理
        function handleDragStart(e) {
            draggedIndex = parseInt(this.dataset.index);
            this.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
        }

        function handleDrop(e) {
            e.preventDefault();
            const targetIndex = parseInt(this.dataset.index);

            if (isNaN(draggedIndex) || isNaN(targetIndex) || draggedIndex === targetIndex) return;

            const movedItem = holdingsData.splice(draggedIndex, 1)[0];
            holdingsData.splice(targetIndex, 0, movedItem);

            renderTable();
        }

        function handleDragEnd(e) {
            this.classList.remove('dragging');
            draggedIndex = null;
        }

        function showToast(title, text, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = "p-3.5 rounded-xl shadow-2xl border bg-gray-900 border-gray-700 text-white text-xs flex items-center gap-2";
            toast.innerHTML = `<strong class="${type === 'success' ? 'text-emerald-400' : type === 'error' ? 'text-rose-400' : 'text-amber-400'}">${title}:</strong> <span>${text}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        window.onload = function() {
            renderTable();
        };
    </script>
</body>
</html>
